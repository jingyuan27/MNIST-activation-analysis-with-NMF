
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mnist-activation-nmf"
version = "0.1.0"
description = "Analysis of neural network activations using NMF on MNIST."
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "matplotlib",
    "torch",
    "torchvision",
    "scikit-learn",
    "pandas",
    "PyYAML"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff"
]

[tool.setuptools.packages.find]
where = ["src"]
